name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The spec requires gcc 12 and clang 15; both are preinstalled on the
          # runner images, and the requested version is selected explicitly so a
          # future image bump cannot silently change the compiler under test.
          - name: ubuntu-latest / gcc-12 (TLS on)
            os: ubuntu-latest
            cxx: g++-12
            cc: gcc-12
            openssl: "ON"
          - name: macos-latest / clang
            os: macos-latest
            cxx: clang++
            cc: clang
            openssl: "OFF"
    steps:
      - name: Check out (with submodules, if any)
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install gcc-12 and the TLS headers (ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libssl-dev is what the TLS-enabled leg links against, so the
          # #ifdef CPPHTTPLIB_OPENSSL_SUPPORT blocks are compiled on every push.
          sudo apt-get install -y gcc-12 g++-12 libssl-dev
          g++-12 --version
      - name: Report compiler versions
        run: |
          ${{ matrix.cc }} --version
          cmake --version
      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DFIXIT_TEST_COMPILER=${{ matrix.cxx }}
          -DFIXIT_ENABLE_OPENSSL=${{ matrix.openssl }}
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      # The demos are part of the acceptance criteria: e1 and e2 must be fixed
      # The Catch2 suite never opens a socket (MockLlm answers in-process), so the
      # HTTP client, the OpenAI JSON shapes and the tool-call round trip are only
      # covered here: a scripted server drives the real binary over real sockets.
      - name: AI mode smoke test (offline stub model)
        shell: bash
        run: |
          set -eux
          FIXIT_BIN="$GITHUB_WORKSPACE/build/bin/fixit" PYTHON=python3 \
            bash tools/ai_mode_smoke.sh
      # by the mock (exit 0) and e3 must be left alone (exit 1).  --no-write
      # repairs a scratch copy so the checkout stays clean.
      - name: Demo smoke test
        shell: bash
        run: |
          set -eux
          BIN="$GITHUB_WORKSPACE/build/bin/fixit"
          "$BIN" examples/buggy/e1_missing_include.cpp --agent --llm mock --verbose \
            --compiler ${{ matrix.cxx }} --no-write
          "$BIN" examples/buggy/e2_drift.cpp --agent --llm mock \
            --compiler ${{ matrix.cxx }} --no-write
          if "$BIN" examples/buggy/e3_type_error.cpp --agent --llm mock \
               --compiler ${{ matrix.cxx }} --no-write; then
            echo "e3 must NOT be fixed by the mock rules"; exit 1
          fi
          git diff --exit-code   # the demos must not have touched the tree
  # Windows is validated with the MSYS2 UCRT64 toolchain.  The project officially
  # supports gcc/clang (not MSVC), and this is exactly the toolchain the Windows
  # setup guide installs.  Ninja is the generator because mingw32-make misreads
  # CMake's UTF-8 Makefiles under some locales.  -static makes the produced
  # executables independent of the MinGW runtime DLLs, which matters for the
  # ctest PATH handling.
  windows:
    name: windows-latest / msys2-ucrt64 (${{ matrix.openssl }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Two legs, because TLS is a different code path on Windows: with OpenSSL,
        # cpp-httplib verifies the chain against the Windows certificate store
        # through WinCrypt, which needs crypt32 linked.  A plain build never
        # compiles any of that, so only this leg would catch a regression such as
        # `undefined reference to __imp_CertGetCertificateChain`.
        include:
          - openssl: "OFF"
          - openssl: "ON"
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out (with submodules, if any)
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install the UCRT64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            ${{ matrix.openssl == 'ON' && 'mingw-w64-ucrt-x86_64-openssl' || '' }}
      - name: Report compiler versions
        run: |
          gcc --version
          cmake --version
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++
          -DFIXIT_TEST_COMPILER=g++
          -DFIXIT_ENABLE_OPENSSL=${{ matrix.openssl }}
          -DCMAKE_EXE_LINKER_FLAGS=-static
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Demo smoke test
        run: |
          set -eux
          BIN="build/bin/fixit.exe"
          "$BIN" examples/buggy/e1_missing_include.cpp --agent --llm mock --verbose \
            --compiler g++ --no-write
          "$BIN" examples/buggy/e2_drift.cpp --agent --llm mock \
            --compiler g++ --no-write
          if "$BIN" examples/buggy/e3_type_error.cpp --agent --llm mock \
               --compiler g++ --no-write; then
            echo "e3 must NOT be fixed by the mock rules"; exit 1
          fi
                    # The msys2 shell does not put the runner's Git on PATH, so a bare
          # `git` here exited 127 *after* all three demos had already passed.
          GIT="$(command -v git || echo 'C:/Program Files/Git/bin/git.exe')"
          "$GIT" diff --exit-code
